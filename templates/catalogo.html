<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f6f2eb">
<title>AconXego — Demonstração do catálogo</title>
<style>
:root{color-scheme:light;--paper:#f6f2eb;--ink:#493d31;--gold:#96713e;--line:#ded4c5}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,sans-serif}header,main,footer{max-width:1160px;margin:auto;padding:24px 32px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.brand{font:36px Georgia,serif;letter-spacing:-1.8px;color:var(--ink);text-decoration:none}nav{display:flex;gap:24px}a{color:inherit;text-underline-offset:5px}nav a{text-decoration:none;font-size:14px}nav a[aria-current]{color:var(--gold);border-bottom:1px solid}.intro{padding:62px 0 38px;max-width:720px}.eyebrow{text-transform:uppercase;font-size:11px;letter-spacing:3px;color:var(--gold)}h1,h2,h3{font-family:Georgia,serif;font-weight:normal;line-height:1.15}h1{font-size:clamp(38px,6vw,64px);margin:16px 0 22px}h2{font-size:30px;margin:0}p{max-width:620px}.muted{color:#776b5f}.section-head{display:flex;justify-content:space-between;align-items:center;margin:12px 0 24px}.section-head span{font-size:13px;color:#776b5f}.product{display:grid;grid-template-columns:1.15fr 1fr;background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden}.photo{background:#eae4da;display:flex;align-items:center;justify-content:center;padding:20px}.photo img{display:block;width:100%;height:480px;object-fit:contain}.info{padding:52px 40px;align-self:center}.info h3{font-size:36px;margin:18px 0}.button{display:inline-block;background:var(--ink);color:white;padding:14px 25px;border:1px solid var(--ink);font:inherit;border-radius:2px;cursor:pointer}.button:hover{background:#695541}.button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:5px}.pending{font-size:13px;color:#776b5f;margin-top:22px}.notice{margin:30px 0;background:#eee7dc;border-left:2px solid var(--gold);padding:18px 22px;font-size:13px}.notice p{margin:0}footer{margin-top:45px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;font-size:13px;color:#776b5f}dialog{max-width:850px;width:calc(100% - 32px);border:1px solid var(--line);border-radius:5px;padding:28px;background:var(--paper);color:var(--ink)}dialog::backdrop{background:#29221acc}dialog img{width:100%;height:48vh;object-fit:contain;background:#eae4da}.close{float:right;background:transparent;border:1px solid var(--line);padding:8px 14px;color:var(--ink);cursor:pointer}dialog h2{padding:24px 0}dialog p{font-size:14px}.empty-note{font-size:14px;border-top:1px solid var(--line);margin-top:32px;padding-top:22px}@media(max-width:640px){header,main,footer{padding:20px}header{align-items:flex-start;gap:15px;flex-direction:column}.brand{font-size:32px}.intro{padding:38px 0 24px}.product{grid-template-columns:1fr}.photo{padding:12px}.photo img{height:330px}.info{padding:26px}.info h3{font-size:30px}.section-head{gap:16px}.section-head h2{font-size:26px}footer{flex-direction:column}.button{width:100%;text-align:center}}
.photo-open{border:0;cursor:pointer;width:100%}.photo-open:focus-visible,.gallery button:focus-visible{outline:3px solid var(--gold);outline-offset:-4px}.gallery{display:flex;gap:12px;align-items:center;justify-content:center;margin:16px 0}.gallery button{border:1px solid var(--line);background:white;color:var(--ink);padding:12px 16px;cursor:pointer;font:inherit}.gallery button[aria-pressed="true"]{border:2px solid var(--gold);background:#eee7dc}.gallery-status{text-align:center;font-size:13px}dialog{max-height:90dvh;overflow:auto}</style>
</head>
<body>
<header><a href="#" class="brand" aria-label="AconXego início">AconXego</a><nav aria-label="Coleções"><a href="#natalinos">Natalinos</a><a href="#religiosos" aria-current="page">Artigos Religiosos</a></nav></header>
<main>
<section class="intro"><span class="eyebrow">Catálogo • AconXego</span><h1>Detalhes que acolhem.</h1><p class="muted">Conheça nossa seleção de peças decorativas e religiosas para a sua loja.</p></section>
{{COLECOES}}
</main>
<footer><span class="brand">AconXego</span><span>Prévia local • sem preços ou pedidos online</span></footer>
{{DETALHES}}

</script>
</body></html>
